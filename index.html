<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ödeme Bilgileri</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-text:#fff;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--accent:#3b82f6;--accent-text:#fff;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--line:#334155;--accent:#3b82f6;--accent-text:#fff;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:1.2rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}
.row{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.val{font-size:1.05rem;font-weight:600;margin:4px 0 10px;word-break:break-all}
button{width:100%;border:0;border-radius:12px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-text)}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
</style>
</head>
<body>
<div class="card">
  <h1>Ödeme Bilgileri</h1>
  <p class="sub">Kopyalamak için butona dokunun.</p>

  <div class="row">
    <div class="lbl">Ad Soyad</div>
    <div class="val" id="name">Ömer Yeşilırmak</div>
    <button data-copy="name">İsmi Kopyala</button>
  </div>

  <div class="row">
    <div class="lbl">IBAN</div>
    <div class="val" id="iban">TR58 0006 7010 0000 0077 8332 12</div>
    <button data-copy="iban">IBAN’ı Kopyala</button>
  </div>

  <button class="alt" id="all">Hepsini Kopyala</button>
</div>

<script>
function clean(id){
  var t=document.getElementById(id).textContent.trim();
  return id==="iban"?t.replace(/\s+/g,""):t;
}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){
    return navigator.clipboard.writeText(text).catch(function(){return fallback(text);});
  }
  return fallback(text);
}
function fallback(text){
  return new Promise(function(res,rej){
    var ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy")?res():rej();}catch(e){rej(e);}
    document.body.removeChild(ta);
  });
}
function flash(btn){
  var old=btn.textContent;
  btn.textContent="Kopyalandı ✓";btn.classList.add("done");
  setTimeout(function(){btn.textContent=old;btn.classList.remove("done");},1800);
}
document.querySelectorAll("button[data-copy]").forEach(function(b){
  b.addEventListener("click",function(){
    copyText(clean(b.dataset.copy)).then(function(){flash(b);});
  });
});
document.getElementById("all").addEventListener("click",function(){
  var b=this;
  copyText(clean("name")+"\n"+clean("iban")).then(function(){flash(b);});
});
</script>
</body>
</html>
